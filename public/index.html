<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodeBox Board</title>
    <style>
      :root {
        --bg: #0b1120;
        --card: #151f34;
        --line: #26314d;
        --text: #e6edf7;
        --muted: #8ea1c0;
        --accent: #4cc2ff;
        --accent-ink: #052232;
        --danger: #ff6b6b;
        --evt: #ffd166;
        --proj: #a78bfa;
        --ann: #4cc2ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 70% -10%, #17223b 0%, var(--bg) 55%);
        color: var(--text);
        min-height: 100vh;
      }
      .wrap { max-width: 760px; margin: 0 auto; padding: 2rem 1rem 4rem; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
      .brand h1 { margin: 0; font-size: 1.7rem; letter-spacing: -0.02em; }
      .brand h1 b { color: var(--accent); }
      .brand p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.9rem; }
      .who { display: flex; align-items: center; gap: 0.6rem; font-size: 0.9rem; color: var(--muted); }
      .who b { color: var(--text); }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 1.25rem;
        margin-bottom: 1.25rem;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      }
      label { display: block; font-size: 0.8rem; color: var(--muted); margin: 0 0 0.3rem; }
      input, textarea, select {
        width: 100%;
        padding: 0.6rem 0.7rem;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: #0c1526;
        color: var(--text);
        font-size: 0.95rem;
        font-family: inherit;
      }
      textarea { resize: vertical; min-height: 70px; }
      .row { display: flex; gap: 0.7rem; flex-wrap: wrap; }
      .row > div { flex: 1 1 160px; }
      .field { margin-bottom: 0.7rem; }
      button {
        padding: 0.6rem 1.1rem;
        border-radius: 9px;
        border: none;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 700;
        cursor: pointer;
        font-size: 0.92rem;
      }
      button:hover { filter: brightness(1.08); }
      button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
      button.link { background: none; color: var(--muted); padding: 0; font-weight: 500; text-decoration: underline; }
      .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
      .tabs button { background: transparent; color: var(--muted); border: 1px solid var(--line); }
      .tabs button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
      .post { border-bottom: 1px solid var(--line); padding: 1rem 0; }
      .post:last-child { border-bottom: none; }
      .post-head { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
      .post h3 { margin: 0; font-size: 1.08rem; }
      .badge { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.15rem 0.5rem; border-radius: 999px; font-weight: 700; }
      .badge.announcement { background: rgba(76,194,255,0.15); color: var(--ann); }
      .badge.event { background: rgba(255,209,102,0.15); color: var(--evt); }
      .badge.project { background: rgba(167,139,250,0.18); color: var(--proj); }
      .post p { margin: 0.5rem 0 0.4rem; color: #cdd8ec; white-space: pre-wrap; }
      .meta { color: var(--muted); font-size: 0.78rem; }
      .actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
      .actions button { padding: 0.3rem 0.65rem; font-size: 0.78rem; }
      .del { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
      .del:hover { background: var(--danger); color: #2a0a0a; filter: none; }
      .err { color: var(--danger); font-size: 0.85rem; min-height: 1.1em; margin-top: 0.4rem; }
      .empty { color: var(--muted); padding: 1rem 0; }
      .hidden { display: none !important; }
      footer { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 1.5rem; }
      code { background: #0c1526; padding: 0.1rem 0.35rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <h1><b>Code</b>Box Board</h1>
          <p>The coding club's board · announcements, events &amp; projects</p>
        </div>
        <div class="who" id="who"></div>
      </header>

      <!-- AUTH -->
      <div class="card" id="auth-card">
        <div class="tabs">
          <button id="tab-login" class="active">Log in</button>
          <button id="tab-register">Register</button>
        </div>
        <div class="field">
          <label>Username</label>
          <input id="auth-username" placeholder="e.g. ada_l" autocomplete="username" />
        </div>
        <div class="field">
          <label>Password</label>
          <input id="auth-password" type="password" placeholder="6+ characters" autocomplete="current-password" />
        </div>
        <button id="auth-submit">Log in</button>
        <div class="err" id="auth-err"></div>
      </div>

      <!-- NEW POST (auth only) -->
      <div class="card hidden" id="compose-card">
        <div class="field">
          <label>Title</label>
          <input id="p-title" placeholder="What's happening?" />
        </div>
        <div class="field">
          <label>Details</label>
          <textarea id="p-body" placeholder="Add the details…"></textarea>
        </div>
        <div class="row">
          <div class="field">
            <label>Category</label>
            <select id="p-category">
              <option value="announcement">Announcement</option>
              <option value="event">Event</option>
              <option value="project">Project</option>
            </select>
          </div>
          <div class="field" style="display:flex; align-items:flex-end;">
            <button id="p-submit" style="width:100%;">Post to board</button>
          </div>
        </div>
        <div class="err" id="p-err"></div>
      </div>

      <!-- BOARD -->
      <div class="card">
        <div id="board"><div class="empty">Loading board…</div></div>
      </div>

      <footer>
        Auth via JWT · data in SQLite · <code>GET /api/posts</code> is public, writes require login
      </footer>
    </div>

    <script>
      const api = (p, opts = {}) => {
        const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
        const token = localStorage.getItem("cb_token");
        if (token) headers.Authorization = "Bearer " + token;
        return fetch(p, { ...opts, headers });
      };
      const $ = (id) => document.getElementById(id);
      const state = { user: null, mode: "login", editing: null };

      function esc(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      // ---- Auth UI ----
      function setMode(mode) {
        state.mode = mode;
        $("tab-login").classList.toggle("active", mode === "login");
        $("tab-register").classList.toggle("active", mode === "register");
        $("auth-submit").textContent = mode === "login" ? "Log in" : "Create account";
        $("auth-err").textContent = "";
      }
      $("tab-login").onclick = () => setMode("login");
      $("tab-register").onclick = () => setMode("register");

      $("auth-submit").onclick = async () => {
        $("auth-err").textContent = "";
        const username = $("auth-username").value.trim();
        const password = $("auth-password").value;
        const path = state.mode === "login" ? "/api/auth/login" : "/api/auth/register";
        try {
          const res = await api(path, { method: "POST", body: JSON.stringify({ username, password }) });
          const data = await res.json();
          if (!res.ok) { $("auth-err").textContent = data.error || "Something went wrong"; return; }
          localStorage.setItem("cb_token", data.token);
          state.user = data.user;
          $("auth-username").value = ""; $("auth-password").value = "";
          render();
          loadBoard();
        } catch (e) { $("auth-err").textContent = "Network error"; }
      };

      function logout() {
        localStorage.removeItem("cb_token");
        state.user = null;
        render();
        loadBoard();
      }

      function render() {
        if (state.user) {
          $("who").innerHTML = `Signed in as <b>${esc(state.user.username)}</b> &nbsp;<button class="link" id="logout">Log out</button>`;
          $("logout").onclick = logout;
          $("auth-card").classList.add("hidden");
          $("compose-card").classList.remove("hidden");
        } else {
          $("who").innerHTML = "";
          $("auth-card").classList.remove("hidden");
          $("compose-card").classList.add("hidden");
        }
      }

      // ---- Board / CRUD ----
      async function loadBoard() {
        try {
          const res = await api("/api/posts");
          const posts = await res.json();
          const board = $("board");
          if (!Array.isArray(posts) || posts.length === 0) {
            board.innerHTML = '<div class="empty">No posts yet. Be the first to post!</div>';
            return;
          }
          board.innerHTML = posts.map(renderPost).join("");
          board.querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => del(b.dataset.del)));
          board.querySelectorAll("[data-edit]").forEach((b) => (b.onclick = () => startEdit(b.dataset.edit, posts)));
        } catch (e) {
          $("board").innerHTML = '<div class="empty">Could not load the board.</div>';
        }
      }

      function renderPost(p) {
        const mine = state.user && state.user.id === p.member_id;
        const actions = mine
          ? `<div class="actions">
               <button class="ghost" data-edit="${p.id}">Edit</button>
               <button class="del" data-del="${p.id}">Delete</button>
             </div>`
          : "";
        return `
          <div class="post">
            <div class="post-head">
              <h3>${esc(p.title)}</h3>
              <span class="badge ${esc(p.category)}">${esc(p.category)}</span>
            </div>
            <p>${esc(p.body)}</p>
            <div class="meta">by ${esc(p.author)} · ${esc(p.created_at)} UTC</div>
            ${actions}
          </div>`;
      }

      $("p-submit").onclick = async () => {
        $("p-err").textContent = "";
        const title = $("p-title").value.trim();
        const body = $("p-body").value.trim();
        const category = $("p-category").value;
        const editing = state.editing;
        const path = editing ? "/api/posts/" + editing : "/api/posts";
        const method = editing ? "PUT" : "POST";
        try {
          const res = await api(path, { method, body: JSON.stringify({ title, body, category }) });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) { $("p-err").textContent = data.error || "Could not save"; return; }
          $("p-title").value = ""; $("p-body").value = ""; $("p-category").value = "announcement";
          state.editing = null; $("p-submit").textContent = "Post to board";
          loadBoard();
        } catch (e) { $("p-err").textContent = "Network error"; }
      };

      function startEdit(id, posts) {
        const p = posts.find((x) => String(x.id) === String(id));
        if (!p) return;
        state.editing = id;
        $("p-title").value = p.title;
        $("p-body").value = p.body;
        $("p-category").value = p.category;
        $("p-submit").textContent = "Save changes";
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      async function del(id) {
        if (!confirm("Delete this post?")) return;
        try {
          const res = await api("/api/posts/" + id, { method: "DELETE" });
          if (res.ok || res.status === 204) loadBoard();
        } catch (e) {}
      }

      // ---- Boot ----
      async function boot() {
        const token = localStorage.getItem("cb_token");
        if (token) {
          try {
            const res = await api("/api/auth/me");
            if (res.ok) { state.user = (await res.json()).user; }
            else localStorage.removeItem("cb_token");
          } catch (e) {}
        }
        setMode("login");
        render();
        loadBoard();
      }
      boot();
    </script>
  </body>
</html>
