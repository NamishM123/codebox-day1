<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodeBox Board</title>
    <style>
      :root {
        --bg: #0b1120;
        --card: #151f34;
        --line: #26314d;
        --text: #e6edf7;
        --muted: #8ea1c0;
        --accent: #4cc2ff;
        --accent-ink: #052232;
        --danger: #ff6b6b;
        --evt: #ffd166;
        --proj: #a78bfa;
        --ann: #4cc2ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 70% -10%, #17223b 0%, var(--bg) 55%);
        color: var(--text);
        min-height: 100vh;
      }
      .wrap { max-width: 760px; margin: 0 auto; padding: 2rem 1rem 4rem; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
      .brand h1 { margin: 0; font-size: 1.7rem; letter-spacing: -0.02em; }
      .brand h1 b { color: var(--accent); }
      .brand p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.9rem; }
      .who { display: flex; align-items: center; gap: 0.6rem; font-size: 0.9rem; color: var(--muted); }
      .who b { color: var(--text); }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 1.25rem;
        margin-bottom: 1.25rem;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      }
      label { display: block; font-size: 0.8rem; color: var(--muted); margin: 0 0 0.3rem; }
      input, textarea, select {
        width: 100%;
        padding: 0.6rem 0.7rem;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: #0c1526;
        color: var(--text);
        font-size: 0.95rem;
        font-family: inherit;
      }
      textarea { resize: vertical; min-height: 70px; }
      .row { display: flex; gap: 0.7rem; flex-wrap: wrap; }
      .row > div { flex: 1 1 160px; }
      .field { margin-bottom: 0.7rem; }
      button {
        padding: 0.6rem 1.1rem;
        border-radius: 9px;
        border: none;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 700;
        cursor: pointer;
        font-size: 0.92rem;
      }
      button:hover { filter: brightness(1.08); }
      button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
      button.link { background: none; color: var(--muted); padding: 0; font-weight: 500; text-decoration: underline; }
      .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
      .tabs button { background: transparent; color: var(--muted); border: 1px solid var(--line); }
      .tabs button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
      .post { border-bottom: 1px solid var(--line); padding: 1rem 0; }
      .post:last-child { border-bottom: none; }
      .post-head { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
      .post h3 { margin: 0; font-size: 1.08rem; }
      .badge { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.15rem 0.5rem; border-radius: 999px; font-weight: 700; }
      .badge.announcement { background: rgba(76,194,255,0.15); color: var(--ann); }
      .badge.event { background: rgba(255,209,102,0.15); color: var(--evt); }
      .badge.project { background: rgba(167,139,250,0.18); color: var(--proj); }
      .post p { margin: 0.5rem 0 0.4rem; color: #cdd8ec; white-space: pre-wrap; }
      .meta { color: var(--muted); font-size: 0.78rem; }
      .actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
      .actions button { padding: 0.3rem 0.65rem; font-size: 0.78rem; }
      .del { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
      .del:hover { background: var(--danger); color: #2a0a0a; filter: none; }
      .err { color: var(--danger); font-size: 0.85rem; min-height: 1.1em; margin-top: 0.4rem; }
      .empty { color: var(--muted); padding: 1rem 0; }
      .hidden { display: none !important; }
      footer { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 1.5rem; }
      code { background: #0c1526; padding: 0.1rem 0.35rem; border-radius: 4px; }

      /* ---- Projects carousel (dimensional flip) ---- */
      .showcase { margin-bottom: 1.5rem; }
      .showcase h2 { margin: 0 0 0.15rem; font-size: 1.1rem; }
      .showcase .sub2 { margin: 0 0 1rem; color: var(--muted); font-size: 0.85rem; }
      .stage {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 10;
        max-height: 420px;
        perspective: 1400px;
        border-radius: 16px;
      }
      .flipper {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transition: transform 0.75s cubic-bezier(0.76, 0, 0.24, 1);
        border-radius: 16px;
      }
      .face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        align-items: flex-end;
        padding: 1.5rem;
        color: #fff;
      }
      .face.back { transform: rotateY(180deg); }
      .face .ftag {
        position: absolute; top: 1rem; left: 1.25rem;
        font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
        background: rgba(0,0,0,0.28); padding: 0.25rem 0.6rem; border-radius: 999px;
        backdrop-filter: blur(6px);
      }
      .face .fyear {
        position: absolute; top: 1rem; right: 1.25rem;
        font-size: 0.75rem; font-weight: 700; opacity: 0.9;
      }
      .face .fbody { max-width: 90%; }
      .face .fbody h3 { margin: 0 0 0.35rem; font-size: 1.35rem; }
      .face .fbody p { margin: 0 0 0.6rem; font-size: 0.9rem; opacity: 0.92; }
      .face .fbody .tags span {
        display: inline-block; font-size: 0.72rem; margin: 0 0.35rem 0.35rem 0;
        padding: 0.15rem 0.5rem; border-radius: 999px;
        background: rgba(255,255,255,0.18);
      }
      .stage-title {
        position: absolute; inset: 0; z-index: 5; pointer-events: none;
        display: flex; align-items: center; justify-content: center;
        perspective: 1000px;
      }
      .stage-title .big {
        position: absolute; text-align: center; font-weight: 800;
        font-size: clamp(1.6rem, 6vw, 3.2rem); color: #fff;
        text-shadow: 0 6px 30px rgba(0,0,0,0.45);
        transition: transform 0.6s cubic-bezier(0.76,0,0.24,1), opacity 0.5s;
        will-change: transform, opacity;
      }
      .carousel-ctrl {
        display: flex; align-items: center; justify-content: center;
        gap: 0.6rem; margin-top: 0.9rem;
      }
      .carousel-ctrl button {
        height: 42px; width: 42px; border-radius: 999px; padding: 0;
        background: transparent; color: var(--text);
        border: 1px solid var(--line); font-size: 1.1rem; line-height: 1;
      }
      .carousel-ctrl button:hover { background: #ff5f00; color: #fff; border-color: #ff5f00; }
      .dots { display: flex; gap: 0.4rem; align-items: center; }
      .dots button {
        height: 8px; width: 8px; border-radius: 999px; padding: 0;
        background: rgba(255,255,255,0.28); border: none;
      }
      .dots button.active { width: 22px; background: #ff5f00; }

      /* ---- Team finder ---- */
      .section-head { display:flex; align-items:baseline; justify-content:space-between; gap:0.5rem; margin-bottom:0.6rem; }
      .section-head h2 { margin:0; font-size:1.1rem; }
      .section-head .count { color:var(--muted); font-size:0.82rem; }
      .team {
        border:1px solid var(--line); border-radius:12px; padding:1rem;
        margin-bottom:0.9rem; background:#101a2e;
      }
      .team-top { display:flex; align-items:flex-start; justify-content:space-between; gap:0.75rem; }
      .team-top h3 { margin:0; font-size:1.05rem; }
      .team-top .owner { color:var(--muted); font-size:0.78rem; }
      .team .idea { margin:0.5rem 0 0.6rem; color:#cdd8ec; font-size:0.92rem; }
      .team .need { margin-bottom:0.6rem; }
      .team .need span {
        display:inline-block; font-size:0.72rem; margin:0 0.35rem 0.35rem 0;
        padding:0.15rem 0.5rem; border-radius:999px;
        background:rgba(255,95,0,0.15); color:#ffb37a; border:1px solid rgba(255,95,0,0.3);
      }
      .roster { display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:0.6rem; }
      .chip {
        display:flex; align-items:center; gap:0.35rem; font-size:0.78rem;
        background:#0c1526; border:1px solid var(--line); border-radius:999px; padding:0.2rem 0.6rem;
      }
      .chip .av {
        height:18px; width:18px; border-radius:999px; display:grid; place-items:center;
        font-size:0.62rem; font-weight:700; color:#04222e; background:var(--accent);
      }
      .team-foot { display:flex; align-items:center; justify-content:space-between; gap:0.6rem; flex-wrap:wrap; }
      .spots { font-size:0.8rem; color:var(--muted); }
      .spots.full { color:var(--danger); }
      .team-actions { display:flex; gap:0.5rem; }
      .team-actions button { padding:0.4rem 0.9rem; font-size:0.82rem; }
      .btn-join { background:var(--accent); color:var(--accent-ink); }
      .btn-leave { background:transparent; color:var(--muted); border:1px solid var(--line); }
      .btn-danger { background:transparent; color:var(--danger); border:1px solid var(--danger); }
      .btn-full { background:#2a3550; color:var(--muted); cursor:not-allowed; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <h1><b>Code</b>Box Board</h1>
          <p>The coding club's board · announcements, events &amp; projects</p>
        </div>
        <div class="who" id="who"></div>
      </header>

      <!-- PROJECTS SHOWCASE (dimensional flip carousel) -->
      <section class="showcase">
        <h2>Last year's projects</h2>
        <p class="sub2">What the club shipped &mdash; flip through the highlights</p>
        <div class="stage" id="stage" aria-roledescription="carousel">
          <div class="flipper" id="flipper">
            <div class="face front" id="face-front"></div>
            <div class="face back" id="face-back"></div>
          </div>
          <div class="stage-title" aria-hidden="true">
            <div class="big" id="title-a"></div>
            <div class="big" id="title-b" style="opacity:0"></div>
          </div>
        </div>
        <div class="carousel-ctrl">
          <button id="prev" aria-label="Previous project">&larr;</button>
          <div class="dots" id="dots"></div>
          <button id="next" aria-label="Next project">&rarr;</button>
        </div>
      </section>

      <!-- AUTH -->
      <div class="card" id="auth-card">
        <div class="tabs">
          <button id="tab-login" class="active">Log in</button>
          <button id="tab-register">Register</button>
        </div>
        <div class="field">
          <label>Username</label>
          <input id="auth-username" placeholder="e.g. ada_l" autocomplete="username" />
        </div>
        <div class="field">
          <label>Password</label>
          <input id="auth-password" type="password" placeholder="6+ characters" autocomplete="current-password" />
        </div>
        <button id="auth-submit">Log in</button>
        <div class="err" id="auth-err"></div>
      </div>

      <!-- NEW POST (auth only) -->
      <div class="card hidden" id="compose-card">
        <div class="field">
          <label>Title</label>
          <input id="p-title" placeholder="What's happening?" />
        </div>
        <div class="field">
          <label>Details</label>
          <textarea id="p-body" placeholder="Add the details…"></textarea>
        </div>
        <div class="row">
          <div class="field">
            <label>Category</label>
            <select id="p-category">
              <option value="announcement">Announcement</option>
              <option value="event">Event</option>
              <option value="project">Project</option>
            </select>
          </div>
          <div class="field" style="display:flex; align-items:flex-end;">
            <button id="p-submit" style="width:100%;">Post to board</button>
          </div>
        </div>
        <div class="err" id="p-err"></div>
      </div>

      <!-- TEAM FINDER -->
      <section>
        <div class="section-head">
          <h2>Find a hackathon team</h2>
          <span class="count" id="teams-count"></span>
        </div>

        <!-- Create team (auth only) -->
        <div class="card hidden" id="team-compose">
          <div class="field">
            <label>Team name</label>
            <input id="t-name" placeholder="e.g. Team Rocket" />
          </div>
          <div class="field">
            <label>Project idea</label>
            <textarea id="t-idea" placeholder="What are you building?"></textarea>
          </div>
          <div class="row">
            <div class="field">
              <label>Skills you need (comma-separated)</label>
              <input id="t-skills" placeholder="React, ML, Design" />
            </div>
            <div class="field">
              <label>Max team size</label>
              <input id="t-size" type="number" min="1" max="12" value="4" />
            </div>
          </div>
          <button id="t-submit">Create team</button>
          <div class="err" id="t-err"></div>
        </div>

        <div id="teams-list"><div class="empty">Loading teams…</div></div>
      </section>

      <!-- BOARD -->
      <div class="card">
        <div id="board"><div class="empty">Loading board…</div></div>
      </div>

      <footer>
        Auth via JWT · data in SQLite · <code>GET /api/posts</code> is public, writes require login
      </footer>
    </div>

    <script>
      const api = (p, opts = {}) => {
        const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
        const token = localStorage.getItem("cb_token");
        if (token) headers.Authorization = "Bearer " + token;
        return fetch(p, { ...opts, headers });
      };
      const $ = (id) => document.getElementById(id);
      const state = { user: null, mode: "login", editing: null };

      function esc(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      // ---- Auth UI ----
      function setMode(mode) {
        state.mode = mode;
        $("tab-login").classList.toggle("active", mode === "login");
        $("tab-register").classList.toggle("active", mode === "register");
        $("auth-submit").textContent = mode === "login" ? "Log in" : "Create account";
        $("auth-err").textContent = "";
      }
      $("tab-login").onclick = () => setMode("login");
      $("tab-register").onclick = () => setMode("register");

      $("auth-submit").onclick = async () => {
        $("auth-err").textContent = "";
        const username = $("auth-username").value.trim();
        const password = $("auth-password").value;
        const path = state.mode === "login" ? "/api/auth/login" : "/api/auth/register";
        try {
          const res = await api(path, { method: "POST", body: JSON.stringify({ username, password }) });
          const data = await res.json();
          if (!res.ok) { $("auth-err").textContent = data.error || "Something went wrong"; return; }
          localStorage.setItem("cb_token", data.token);
          state.user = data.user;
          $("auth-username").value = ""; $("auth-password").value = "";
          render();
          loadBoard();
          loadTeams();
        } catch (e) { $("auth-err").textContent = "Network error"; }
      };

      function logout() {
        localStorage.removeItem("cb_token");
        state.user = null;
        render();
        loadBoard();
        loadTeams();
      }

      function render() {
        if (state.user) {
          $("who").innerHTML = `Signed in as <b>${esc(state.user.username)}</b> &nbsp;<button class="link" id="logout">Log out</button>`;
          $("logout").onclick = logout;
          $("auth-card").classList.add("hidden");
          $("compose-card").classList.remove("hidden");
          $("team-compose").classList.remove("hidden");
        } else {
          $("who").innerHTML = "";
          $("auth-card").classList.remove("hidden");
          $("compose-card").classList.add("hidden");
          $("team-compose").classList.add("hidden");
        }
      }

      // ---- Board / CRUD ----
      async function loadBoard() {
        try {
          const res = await api("/api/posts");
          const posts = await res.json();
          const board = $("board");
          if (!Array.isArray(posts) || posts.length === 0) {
            board.innerHTML = '<div class="empty">No posts yet. Be the first to post!</div>';
            return;
          }
          board.innerHTML = posts.map(renderPost).join("");
          board.querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => del(b.dataset.del)));
          board.querySelectorAll("[data-edit]").forEach((b) => (b.onclick = () => startEdit(b.dataset.edit, posts)));
        } catch (e) {
          $("board").innerHTML = '<div class="empty">Could not load the board.</div>';
        }
      }

      function renderPost(p) {
        const mine = state.user && state.user.id === p.member_id;
        const actions = mine
          ? `<div class="actions">
               <button class="ghost" data-edit="${p.id}">Edit</button>
               <button class="del" data-del="${p.id}">Delete</button>
             </div>`
          : "";
        return `
          <div class="post">
            <div class="post-head">
              <h3>${esc(p.title)}</h3>
              <span class="badge ${esc(p.category)}">${esc(p.category)}</span>
            </div>
            <p>${esc(p.body)}</p>
            <div class="meta">by ${esc(p.author)} · ${esc(p.created_at)} UTC</div>
            ${actions}
          </div>`;
      }

      $("p-submit").onclick = async () => {
        $("p-err").textContent = "";
        const title = $("p-title").value.trim();
        const body = $("p-body").value.trim();
        const category = $("p-category").value;
        const editing = state.editing;
        const path = editing ? "/api/posts/" + editing : "/api/posts";
        const method = editing ? "PUT" : "POST";
        try {
          const res = await api(path, { method, body: JSON.stringify({ title, body, category }) });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) { $("p-err").textContent = data.error || "Could not save"; return; }
          $("p-title").value = ""; $("p-body").value = ""; $("p-category").value = "announcement";
          state.editing = null; $("p-submit").textContent = "Post to board";
          loadBoard();
        } catch (e) { $("p-err").textContent = "Network error"; }
      };

      function startEdit(id, posts) {
        const p = posts.find((x) => String(x.id) === String(id));
        if (!p) return;
        state.editing = id;
        $("p-title").value = p.title;
        $("p-body").value = p.body;
        $("p-category").value = p.category;
        $("p-submit").textContent = "Save changes";
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      async function del(id) {
        if (!confirm("Delete this post?")) return;
        try {
          const res = await api("/api/posts/" + id, { method: "DELETE" });
          if (res.ok || res.status === 204) loadBoard();
        } catch (e) {}
      }

      // ---- Team finder ----
      function initials(name) {
        return String(name).slice(0, 2).toUpperCase();
      }

      async function loadTeams() {
        try {
          const res = await api("/api/teams");
          const teams = await res.json();
          $("teams-count").textContent =
            Array.isArray(teams) && teams.length
              ? `${teams.length} team${teams.length === 1 ? "" : "s"} recruiting`
              : "";
          const list = $("teams-list");
          if (!Array.isArray(teams) || teams.length === 0) {
            list.innerHTML =
              '<div class="empty">No teams yet. ' +
              (state.user ? "Create one above!" : "Log in to start one!") +
              "</div>";
            return;
          }
          list.innerHTML = teams.map(renderTeam).join("");
          list.querySelectorAll("[data-join]").forEach((b) => (b.onclick = () => teamAction(b.dataset.join, "join")));
          list.querySelectorAll("[data-leave]").forEach((b) => (b.onclick = () => teamAction(b.dataset.leave, "leave")));
          list.querySelectorAll("[data-tdel]").forEach((b) => (b.onclick = () => deleteTeam(b.dataset.tdel)));
        } catch (e) {
          $("teams-list").innerHTML = '<div class="empty">Could not load teams.</div>';
        }
      }

      function renderTeam(t) {
        const uid = state.user && state.user.id;
        const isMember = uid && t.members.some((m) => m.id === uid);
        const isOwner = uid && t.owner_id === uid;
        const full = t.spots_left <= 0;

        const roster = t.members
          .map((m) => `<span class="chip"><span class="av">${esc(initials(m.username))}</span>${esc(m.username)}${m.id === t.owner_id ? " ⭐" : ""}</span>`)
          .join("");
        const needs = t.skills_needed.length
          ? `<div class="need">${t.skills_needed.map((s) => `<span>${esc(s)}</span>`).join("")}</div>`
          : "";

        let action = "";
        if (!state.user) {
          action = `<span class="spots">Log in to join</span>`;
        } else if (isOwner) {
          action = `<button class="btn-danger" data-tdel="${t.id}">Delete team</button>`;
        } else if (isMember) {
          action = `<button class="btn-leave" data-leave="${t.id}">Leave</button>`;
        } else if (full) {
          action = `<button class="btn-full" disabled>Full</button>`;
        } else {
          action = `<button class="btn-join" data-join="${t.id}">Join team</button>`;
        }

        return `
          <div class="team">
            <div class="team-top">
              <div>
                <h3>${esc(t.name)}</h3>
                <div class="owner">by ${esc(t.owner)} ⭐</div>
              </div>
              <div class="spots ${full ? "full" : ""}">${full ? "Full" : t.spots_left + " spot" + (t.spots_left === 1 ? "" : "s") + " left"}</div>
            </div>
            <p class="idea">${esc(t.idea)}</p>
            ${needs}
            <div class="roster">${roster}</div>
            <div class="team-foot">
              <span class="spots">${t.member_count}/${t.max_size} members</span>
              <div class="team-actions">${action}</div>
            </div>
          </div>`;
      }

      async function teamAction(id, verb) {
        try {
          const res = await api(`/api/teams/${id}/${verb}`, { method: "POST" });
          if (!res.ok) {
            const d = await res.json().catch(() => ({}));
            alert(d.error || `Could not ${verb}`);
          }
          loadTeams();
        } catch (e) {}
      }

      async function deleteTeam(id) {
        if (!confirm("Delete this team?")) return;
        try {
          const res = await api(`/api/teams/${id}`, { method: "DELETE" });
          if (res.ok || res.status === 204) loadTeams();
        } catch (e) {}
      }

      document.getElementById("t-submit").onclick = async () => {
        $("t-err").textContent = "";
        const name = $("t-name").value.trim();
        const idea = $("t-idea").value.trim();
        const skills = $("t-skills").value.split(",").map((s) => s.trim()).filter(Boolean);
        const max_size = Number($("t-size").value) || 4;
        try {
          const res = await api("/api/teams", {
            method: "POST",
            body: JSON.stringify({ name, idea, skills_needed: skills, max_size }),
          });
          const d = await res.json().catch(() => ({}));
          if (!res.ok) { $("t-err").textContent = d.error || "Could not create team"; return; }
          $("t-name").value = ""; $("t-idea").value = ""; $("t-skills").value = ""; $("t-size").value = 4;
          loadTeams();
        } catch (e) { $("t-err").textContent = "Network error"; }
      };

      // ---- Projects carousel (vanilla "dimensional switch") ----
      // Edit this list with your real CodeBox projects.
      const PROJECTS = [
        { name: "StudyBuddy", year: "2024", tag: "Web App",
          blurb: "AI-powered study-group matcher that pairs members by course and schedule.",
          tags: ["React", "Node", "Postgres"],
          grad: "linear-gradient(135deg,#ff5f00,#ff9450)" },
        { name: "HackTrack", year: "2024", tag: "Tooling",
          blurb: "Live hackathon dashboard: teams, submissions, and judging in one place.",
          tags: ["Next.js", "Firebase"],
          grad: "linear-gradient(135deg,#4cc2ff,#5b7cfa)" },
        { name: "CampusEats", year: "2024", tag: "Mobile",
          blurb: "Group food ordering for club events with split-the-bill checkout.",
          tags: ["Flutter", "Stripe"],
          grad: "linear-gradient(135deg,#a78bfa,#7c5cff)" },
        { name: "CodeQuiz", year: "2023", tag: "Game",
          blurb: "Real-time coding trivia the whole room plays from their phones.",
          tags: ["Socket.io", "Express"],
          grad: "linear-gradient(135deg,#22c55e,#0ea5e9)" },
        { name: "DevPortfolio", year: "2023", tag: "Generator",
          blurb: "Turns a GitHub profile into a polished portfolio site in one click.",
          tags: ["Vue", "GitHub API"],
          grad: "linear-gradient(135deg,#f43f5e,#f59e0b)" },
      ];

      const carousel = { i: 0, showingBack: false, animating: false, timer: null };

      function faceHtml(p) {
        return `
          <span class="ftag">${esc(p.tag)}</span>
          <span class="fyear">${esc(p.year)}</span>
          <div class="fbody">
            <h3>${esc(p.name)}</h3>
            <p>${esc(p.blurb)}</p>
            <div class="tags">${p.tags.map((t) => `<span>${esc(t)}</span>`).join("")}</div>
          </div>`;
      }

      function paintDots() {
        $("dots").innerHTML = PROJECTS.map(
          (_, idx) => `<button data-i="${idx}" class="${idx === carousel.i ? "active" : ""}" aria-label="Go to project ${idx + 1}"></button>`
        ).join("");
        $("dots").querySelectorAll("button").forEach((b) => (b.onclick = () => goTo(+b.dataset.i)));
      }

      function initCarousel() {
        const first = PROJECTS[0];
        $("face-front").innerHTML = faceHtml(first);
        $("face-front").style.background = first.grad;
        $("title-a").textContent = first.name;
        paintDots();
        startAuto();
      }

      function flipTo(dir, newIndex) {
        if (carousel.animating || newIndex === carousel.i) return;
        carousel.animating = true;

        const goingNext = dir === "next";
        const p = PROJECTS[newIndex];
        const incomingFace = carousel.showingBack ? $("face-front") : $("face-back");
        incomingFace.innerHTML = faceHtml(p);
        incomingFace.style.background = p.grad;

        // Flip the card
        carousel.showingBack = !carousel.showingBack;
        const rot = carousel.showingBack ? 180 : 0;
        $("flipper").style.transform = `rotateY(${rot}deg)`;

        // Swap the big title with a translate/rotate
        const outEl = $("title-a").style.opacity !== "0" ? $("title-a") : $("title-b");
        const inEl = outEl.id === "title-a" ? $("title-b") : $("title-a");
        const dx = goingNext ? 1 : -1;
        inEl.textContent = p.name;
        inEl.style.transition = "none";
        inEl.style.transform = `translateX(${dx * 60}px) rotateY(${dx * 45}deg)`;
        inEl.style.opacity = "0";
        // force reflow
        void inEl.offsetWidth;
        inEl.style.transition = "";
        outEl.style.transform = `translateX(${-dx * 60}px) rotateY(${-dx * 45}deg)`;
        outEl.style.opacity = "0";
        inEl.style.transform = "translateX(0) rotateY(0)";
        inEl.style.opacity = "1";

        carousel.i = newIndex;
        paintDots();
        setTimeout(() => { carousel.animating = false; }, 760);
      }

      function step(dir) {
        const n = PROJECTS.length;
        const next = dir === "next"
          ? (carousel.i + 1) % n
          : (carousel.i - 1 + n) % n;
        flipTo(dir, next);
      }

      function goTo(idx) {
        if (idx === carousel.i) return;
        const dir = idx > carousel.i ? "next" : "prev";
        flipTo(dir, idx);
      }

      function startAuto() {
        stopAuto();
        carousel.timer = window.setInterval(() => step("next"), 3200);
      }
      function stopAuto() { if (carousel.timer) window.clearInterval(carousel.timer); }

      $("next").onclick = () => { step("next"); startAuto(); };
      $("prev").onclick = () => { step("prev"); startAuto(); };
      $("stage").addEventListener("mouseenter", stopAuto);
      $("stage").addEventListener("mouseleave", startAuto);

      // ---- Boot ----
      async function boot() {
        initCarousel();
        const token = localStorage.getItem("cb_token");
        if (token) {
          try {
            const res = await api("/api/auth/me");
            if (res.ok) { state.user = (await res.json()).user; }
            else localStorage.removeItem("cb_token");
          } catch (e) {}
        }
        setMode("login");
        render();
        loadBoard();
        loadTeams();
      }
      boot();
    </script>
  </body>
</html>
