<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodeBox — Users</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --line: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --danger: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 2rem 1rem;
      }
      .wrap { max-width: 640px; margin: 0 auto; }
      header { margin-bottom: 1.5rem; }
      h1 { margin: 0; font-size: 1.8rem; }
      h1 span { color: var(--accent); }
      p.sub { color: var(--muted); margin: 0.35rem 0 0; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1.25rem;
        margin-bottom: 1.25rem;
      }
      form { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      input {
        flex: 1 1 160px;
        padding: 0.6rem 0.75rem;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #0b1220;
        color: var(--text);
        font-size: 0.95rem;
      }
      button {
        padding: 0.6rem 1rem;
        border-radius: 8px;
        border: none;
        background: var(--accent);
        color: #04222e;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.95rem;
      }
      button:hover { opacity: 0.9; }
      ul { list-style: none; margin: 0; padding: 0; }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.75rem 0;
        border-bottom: 1px solid var(--line);
      }
      li:last-child { border-bottom: none; }
      .u-name { font-weight: 600; }
      .u-email { color: var(--muted); font-size: 0.85rem; }
      .del {
        background: transparent;
        color: var(--danger);
        border: 1px solid var(--danger);
        padding: 0.35rem 0.7rem;
        font-size: 0.8rem;
      }
      .del:hover { background: var(--danger); color: #2b0b0b; }
      .empty { color: var(--muted); padding: 0.75rem 0; }
      .err { color: var(--danger); font-size: 0.85rem; min-height: 1.1em; margin-top: 0.5rem; }
      footer { color: var(--muted); font-size: 0.8rem; text-align: center; margin-top: 1.5rem; }
      code { background: #0b1220; padding: 0.1rem 0.35rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1><span>Code</span>Box</h1>
        <p class="sub">Express + SQLite · full CRUD · live from the database</p>
      </header>

      <div class="card">
        <form id="add-form">
          <input id="name" placeholder="Name" required />
          <input id="email" type="email" placeholder="email@example.com" required />
          <button type="submit">Add user</button>
        </form>
        <div class="err" id="err"></div>
      </div>

      <div class="card">
        <ul id="list"><li class="empty">Loading…</li></ul>
      </div>

      <footer>
        Data served by <code>GET /api/users</code> · Create/Delete hit the same REST API
      </footer>
    </div>

    <script>
      const list = document.getElementById("list");
      const err = document.getElementById("err");

      function showError(msg) {
        err.textContent = msg || "";
      }

      async function load() {
        showError("");
        try {
          const res = await fetch("/api/users");
          const users = await res.json();
          if (!Array.isArray(users) || users.length === 0) {
            list.innerHTML = '<li class="empty">No users yet — add one above.</li>';
            return;
          }
          list.innerHTML = users
            .map(
              (u) => `
              <li>
                <div>
                  <div class="u-name">${escapeHtml(u.name)}</div>
                  <div class="u-email">${escapeHtml(u.email)} · id ${u.id}</div>
                </div>
                <button class="del" data-id="${u.id}">Delete</button>
              </li>`
            )
            .join("");
        } catch (e) {
          showError("Could not load users.");
        }
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));
      }

      document.getElementById("add-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        showError("");
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        try {
          const res = await fetch("/api/users", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email }),
          });
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            showError(data.error || "Could not add user.");
            return;
          }
          document.getElementById("name").value = "";
          document.getElementById("email").value = "";
          load();
        } catch (e) {
          showError("Could not add user.");
        }
      });

      list.addEventListener("click", async (e) => {
        const btn = e.target.closest(".del");
        if (!btn) return;
        showError("");
        try {
          const res = await fetch("/api/users/" + btn.dataset.id, { method: "DELETE" });
          if (!res.ok && res.status !== 204) {
            showError("Could not delete user.");
            return;
          }
          load();
        } catch (e) {
          showError("Could not delete user.");
        }
      });

      load();
    </script>
  </body>
</html>
